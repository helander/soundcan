#name: soundcan

services:

  # dela upp desktop i xserver vncserver och desktop med 1 process i varje
  desktop:
    build: desktop
    restart: unless-stopped
    ports:
      - 5900:5900
      - 6000:6000
      - 9001:9001

  tools:
    build: tools
    restart: unless-stopped
    volumes:
      - $XDG_RUNTIME_DIR/pipewire-0:/tmp/pipewire-0
      - tools-data:/tools-data
    devices:
      - /dev/snd:/dev/snd


  ui:
    build: newui
    restart: unless-stopped
    ports:
      - 9999:3300
    volumes:
      - session:/session
      - $XDG_RUNTIME_DIR/pipewire-0:/tmp/pipewire-0

  essential-keys-a:
    build: fluidsynth
    restart: unless-stopped
    ports:
      - 9800:9800
    volumes:
      - $XDG_RUNTIME_DIR/pipewire-0:/tmp/pipewire-0
      - $PWD/store/Essential-Keys-SF-v1.3.sf2:/soundfont
    environment:
      FONT_TITLE: "Essential Keys A"

  essential-keys-b:
    build: fluidsynth
    restart: unless-stopped
    volumes:
      - $XDG_RUNTIME_DIR/pipewire-0:/tmp/pipewire-0
      - $PWD/store/Essential-Keys-SF-v1.3.sf2:/soundfont
    ports:
      - 3001:3000
    environment:
      FONT_TITLE: "Essential Keys B"

  mona-lisa-a:
    build: fluidsynth
    restart: unless-stopped
    volumes:
      - $PWD/store/Monalisa-GM-v2_06_5.sf2:/soundfont
    ports:
      - 3010:3000
    environment:
      FONT_TITLE: "Mona Lisa A"

  mona-lisa-b:
    build: fluidsynth
    restart: unless-stopped
    volumes:
      - $XDG_RUNTIME_DIR/pipewire-0:/tmp/pipewire-0
      - $PWD/store/Monalisa-GM-v2_06_5.sf2:/soundfont
    ports:
      - 3011:3000
    environment:
      FONT_TITLE: "Mona Lisa B"

  setbfree:
    build: setbfree
    restart: unless-stopped
    volumes:
      - $XDG_RUNTIME_DIR/pipewire-0:/tmp/pipewire-0
    ports:
      - 3100:3100
      - 3101:3101

volumes:
  tools-data:
  session:
