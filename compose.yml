#name: soundcan

services:

  desktop:
    build: desktop
    restart: unless-stopped
    ports:
      - 5900:5900
      - 6000:6000
      - 9001:9001

  tools:
    build: tools
    restart: unless-stopped
    volumes:
      - $XDG_RUNTIME_DIR/pipewire-0:/tmp/pipewire-0
      - tools-data:/tools-data
    devices:
      - /dev/snd:/dev/snd


